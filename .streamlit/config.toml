[global]
developmentMode = false

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[theme]
base = "dark"
primaryColor = "#d4af37"
backgroundColor = "#0f1923"
secondaryBackgroundColor = "#1a2a3a"
textColor = "#ffffff"
font = "sans serif"